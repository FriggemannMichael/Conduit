name: CI

on:
  workflow_call:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and test
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Lint backend with ruff
        run: docker run --rm --volume "${GITHUB_WORKSPACE}/backend:/io" --workdir /io ghcr.io/astral-sh/ruff:0.17.3 check --no-cache .

      - name: Build backend dev image
        run: docker build --file backend/Dockerfile.dev --tag conduit-backend-dev:ci backend

      - name: Run backend Tests
        run: docker run --rm --volume "${GITHUB_WORKSPACE}/backend:/app" conduit-backend-dev:ci

  smoke:
    name: Compose smoke test
    needs: backend
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Create test environment file
        run: |
          {
            echo "DJANGO_SECRET_KEY=$(openssl rand -hex 32)"
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
          } > .env

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build and start stack
        id: start
        run: docker compose up --detach --build --wait

      - name: Check frontend and API
        timeout-minutes: 3
        run: |
          for ATTEMPT in {1..30}; do
            echo "Checking stack (attempt ${ATTEMPT}/30)"
            if curl --fail --silent --show-error --output /dev/null http://localhost:8282/ \
              && curl --fail --silent --show-error http://localhost:8282/api/tags; then
              exit 0
            fi
            sleep 5
          done
          echo "Stack did not respond on port 8282" >&2
          exit 1

      - name: Check backend runs gunicorns
        run: docker compose top backend | grep gunicorn

      - name: Show container logs on failure
        if: ${{ failure() && steps.start.outcome != 'skipped' }}
        run: docker compose logs --no-color

      - name: Remove stack
        if: ${{ always() && steps.start.outcome != 'skipped' }}
        run: docker compose down --volumes
