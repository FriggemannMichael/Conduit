name: Check and deploy Conduit

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/ci.yml

  quality:
    uses: ./.github/workflows/quality.yml

  publish:
    name: Build and push images
    needs: [ build, quality ]
    if: ${{ github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "${GHCR_TOKEN}" | docker login ghcr.io --username "${GITHUB_ACTOR}" --password-stdin

      - name: Build and push images
        run: |
          set -euo pipefail
          IMAGE_PREFIX="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conduit"
          for SERVICE in backend frontend; do
            IMAGE="${IMAGE_PREFIX}-${SERVICE}"
            docker build \
              --tag "${IMAGE}:${GITHUB_SHA}" \
              --tag "${IMAGE}:latest" \
              --label "org.opencontainers.image.source=${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
              "./${SERVICE}"
            docker push --all-tags "${IMAGE}"
          done

  deploy:
    name: Deploy to VM
    needs: [ publish ]
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Prepare SSH key
        env:
          VM_SSH_KEY: ${{ secrets.VM_SSH_KEY }}
        run: |
          install -m 700 -d "${HOME}/.ssh"
          printf '%s\n' "${VM_SSH_KEY}" > "${HOME}/.ssh/deploy_key"
          chmod 600 "${HOME}/.ssh/deploy_key"

      - name: Verify SSH connection
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          ssh-keyscan -T 10 -H "${VM_HOST}" >> "${HOME}/.ssh/known_hosts"
          ssh -i "${HOME}/.ssh/deploy_key" -o BatchMode=yes "${VM_USER}@${VM_HOST}" 'echo "SSH connection established"'

      - name: Write environment file on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          test -n "${ENV_FILE}" || { echo "Secret ENV_FILE is empty or missing" >&2; exit 1; }
          printf '%s\n' "${ENV_FILE}" |
            ssh -i "${HOME}/.ssh/deploy_key" -o BatchMode=yes "${VM_USER}@${VM_HOST}" \
              'mkdir -p "${HOME}/conduit" && umask 077 && cat > "${HOME}/conduit/.env"'

      - name: Copy Compose file to VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
        run: |
          scp -i "${HOME}/.ssh/deploy_key" -o BatchMode=yes \
          docker-compose.yaml "${VM_USER}@${VM_HOST}:conduit/docker-compose.yaml"

      - name: Start stack on VM
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
          VM_USER: ${{ secrets.VM_USER }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          ssh -i "${HOME}/.ssh/deploy_key" -o BatchMode=yes "${VM_USER}@${VM_HOST}" \
          "cd conduit && export IMAGE_TAG=${IMAGE_TAG} && docker compose pull && docker compose up --detach --no-build --wait --remove-orphans"

      - name: Check deployed application
        timeout-minutes: 3
        env:
          VM_HOST: ${{ secrets.VM_HOST }}
        run: |
          for ATTEMPT in {1..30}; do
            echo "Checking deployed application (attempt ${ATTEMPT}/30)"
            if curl --fail --silent --show-error --output /dev/null "http://${VM_HOST}:8282/" \
              && curl --fail --silent --show-error --output /dev/null "http://${VM_HOST}:8282/api/tags"; then
              exit 0
            fi
            sleep 5
          done
          echo "Deployed application did not respond on port 8282" >&2
          exit 1